[package]
name = "host-tests"
version = "0.0.0"
edition = "2024"
publish = false
description = "Host tests for the hardware-free code of the LilyGo T5 4.7 inch S3 examples"

[workspace]

[features]
default = ["blocking"]
blocking = ["epdpi/blocking"]

[dependencies]
epdpi = { version = "0.1", default-features = false, features = ["graphics"] }
embedded-graphics = "0.8.1"
fontdue = "0.9.5"
embedded-sdmmc = "0.10.0"
minipng = "1.0"
tinybmp = "0.6.0"
timezone-data = "0.2.0"
serde_json = { version = "1", default-features = false, features = ["alloc"] }
tinygif = "0.0.4"
zune-core = { version = "0.5.1", default-features = false }
zune-jpeg = { version = "0.5.15", default-features = false }

[profile.dev]
opt-level = 2
