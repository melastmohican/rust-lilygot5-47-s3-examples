[package]
edition      = "2024"
name         = "rust-lilygot5-47-s3-examples"
rust-version = "1.88"
version      = "0.1.0"
license      = "GPL-3.0-only"
description  = "Hardware bring-up examples for the epdpi driver on the LilyGo T5 4.7 inch S3 V2.4 (ESP32-S3, ED047TC1 e-paper)"
keywords     = ["esp32s3", "epaper", "embedded", "lilygo", "t5"]
categories   = ["embedded", "no-std"]

[dependencies]
esp-hal                = { version = "~1.1.0", features = ["defmt", "esp32s3", "unstable"] }
esp-alloc              = { version = "0.10.0", features = ["defmt", "esp32s3"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["defmt", "esp32s3"] }
esp-println            = { version = "0.17.0", features = ["defmt-espflash", "esp32s3"] }

defmt             = "1.0.1"
critical-section  = "1.2.0"
embedded-graphics = "0.8.1"
embedded-hal      = "1.0.0"

# Blocking API (the default features). The async twin is its own project because Cargo would
# unify the two modes inside one workspace.
epdpi     = { version = "0.1", features = ["defmt"] }
epdpi-esp = { version = "0.1", features = ["esp32s3", "defmt"] }

[dev-dependencies]
fontdue = { version = "0.9.5", default-features = false, features = ["hashbrown"] }
embedded-hal-bus = "0.2.0"
pcf8563 = "0.2.1"
gt911 = "0.3.0"
serde_json = { version = "1", default-features = false, features = ["alloc"] }
# Git, not crates.io: 0.14.0 pulls embedded-tls 0.18, which does not build with the current der
# crates. Go back to crates.io when reqwless 0.14.1 is released.
reqwless = { git = "https://github.com/drogue-iot/reqwless", rev = "094f5b850deb07f8a24086f546f7ac495d9f1ef2", features = ["defmt", "rsa"] }
timezone-data = "0.2.0"
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
embassy-net = { version = "0.9.1", features = ["defmt", "udp", "tcp", "dns", "dhcpv4", "medium-ethernet", "proto-ipv4"] }
esp-radio = { version = "0.18.0", features = ["wifi", "esp32s3", "unstable", "defmt"] }
esp-rtos = { version = "0.3.0", features = ["defmt", "embassy", "esp32s3", "esp-radio", "esp-alloc"] }
sntpc = { version = "0.11.0", default-features = false, features = ["defmt"] }
sntpc-net-embassy = { version = "0.11.0", default-features = false, features = ["defmt"] }
sntpc-time-embassy = "0.6.0"
embedded-sdmmc = { version = "0.10.0", default-features = false }
minipng = "1.0"
tinybmp = "0.6.0"
tinygif = "0.0.4"
zune-core = { version = "0.5.1", default-features = false }
zune-jpeg = { version = "0.5.15", default-features = false }
u8g2-fonts = { version = "0.8.0", features = ["embedded_graphics_textstyle"] }

[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
